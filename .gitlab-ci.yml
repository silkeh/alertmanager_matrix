---
include:
  - component: $CI_SERVER_FQDN/slxh/pipelines/go@main
    inputs:
      go_binaries: []
      golangci_lint_version: v2.14
      release_artifacts: '*.tar.gz *.rpm **/*.rpm'

variables:
  CGO_ENABLED: 0

build:
  stage: build
  needs: []
  parallel:
    matrix:
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: freebsd
        GOARCH: [386, amd64, arm]
      - GOOS: linux
        GOARCH: [386, amd64, arm, arm64, ppc64, ppc64le,
                 mips, mipsle, mips64, mips64le, riscv64, s390x]
      - GOOS: openbsd
        GOARCH: [386, amd64, arm, arm64]
      - GOOS: windows
        GOARCH: [386, amd64, arm64]
  script:
    - go build -ldflags="-s -w" ./cmd/alertmanager_matrix
    - tar -cavf alertmanager_matrix-$GOOS-$GOARCH.tar.gz ./alertmanager_matrix*
  artifacts:
    name: alertmanager_matrix-$GOOS-$GOARCH
    paths:
      - "*.tar.gz"

sources:
  stage: build
  needs: []
  script:
    - go mod vendor
    - tar --exclude-from=.gitignore -caf sources.tar.gz *
  artifacts:
    paths:
      - sources.tar.gz

package rpm:
  stage: build
  needs: [sources]
  image: fedora
  script:
    - dnf -q -y --setopt=install_weak_deps=False install git golang fedora-packager rpmdevtools
    - make rpm
  artifacts:
    paths:
      - "*.rpm"
      - "**/*.rpm"
